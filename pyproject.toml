[project]
name = "wbtech-ds"
version = "0.1.0"
description = "Практика курса «Специалист по Data Science» (WB Техношкола)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-CONTENT.md"]
authors = [{ name = "Taras Malinovskii" }]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
    "scipy-stubs~=1.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ds_course"]
